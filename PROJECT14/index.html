<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Mood Booth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="../index.html" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      Home
    </a>
    <span class="nav-title">🐈 mood.booth</span>
  </nav>

  <main class="booth">
    <header class="hero">
      <h1>Cat Mood Booth</h1>
      <p>Pick a mood, pull a fresh batch, and explore one featured cat at a time.</p>
    </header>

    <section class="booth-grid">
      <article class="spotlight">
        <div class="photo-wrap">
          <img id="featuredCat" src="" alt="Featured cat">
          <span id="moodPill" class="mood-pill">Ready</span>
        </div>
        <p id="caption" class="caption">Press “Shuffle Batch” to start.</p>
        <div class="spotlight-controls">
          <button id="prevBtn" class="btn btn-outline">←</button>
          <button id="shuffleOneBtn" class="btn btn-outline">Shuffle One</button>
          <button id="nextBtn" class="btn btn-outline">→</button>
        </div>
      </article>

      <aside class="panel">
        <div class="field">
          <label for="moodSelect">Mood preset</label>
          <select id="moodSelect">
            <option value="playful" selected>Playful</option>
            <option value="sleepy">Sleepy</option>
            <option value="serious">Serious</option>
            <option value="chaotic">Chaotic</option>
          </select>
        </div>

        <div class="field">
          <label for="batchSelect">Batch size</label>
          <select id="batchSelect">
            <option value="4">4</option>
            <option value="6" selected>6</option>
            <option value="10">10</option>
          </select>
        </div>

        <label class="switch-row">
          <input type="checkbox" id="autoPlayToggle">
          Auto-play (5s)
        </label>

        <button id="shuffleBatchBtn" class="btn btn-solid full">Shuffle Batch</button>
        <button id="copyBtn" class="btn btn-outline full">Copy Featured Link</button>

        <p id="position" class="position">No images loaded</p>
        <p class="tip">Tip: use keyboard arrows for previous/next.</p>
      </aside>
    </section>

    <section>
      <h2 class="strip-title">Mood Strip</h2>
      <div id="strip" class="strip">
        <p class="empty">No cats in strip yet.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
