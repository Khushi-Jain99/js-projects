<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
        Home
      </a>
  </nav>

  <div class="container">
    <h1>Emoji Generator</h1>
    <p class="subtitle">Click emoji or press spacebar to generate</p>
    
    <div class="emoji-section">
      <div id="emoji" class="emoji-box" role="img" aria-label="Generated emoji" tabindex="0" title="Click to copy">😀</div>
      <div class="info-box">
        <span class="counter">Changes: <span id="count">0</span></span>
        <button id="copy" class="copy-btn" aria-label="Copy emoji">📋 Copy</button>
      </div>
    </div>

    <button id="change" class="generate-btn" aria-label="Generate new emoji">✨ Generate Emoji</button>
    
    <div class="history-box">
      <h3>Recent: <span id="history"></span></h3>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
