<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
        Home
      </a>
    <span class="nav-title">Image Gallery</span>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Random Image Gallery</h1>
      <p class="subtitle">Generate beautiful random images with advanced options</p>
    </div>

    <div class="controls-section">
      <div class="control-group">
        <label for="imageSize">📐 Image Size:</label>
        <select id="imageSize" class="select">
          <option value="300">300x300</option>
          <option value="400">400x400</option>
          <option value="500" selected>500x500</option>
          <option value="600">600x600</option>
          <option value="800">800x800</option>
        </select>
      </div>

      <div class="control-group">
        <label for="imageCategory">🏷️ Category:</label>
        <select id="imageCategory" class="select">
          <option value="">Random</option>
          <option value="nature">Nature</option>
          <option value="city">City</option>
          <option value="people">People</option>
          <option value="animals">Animals</option>
          <option value="food">Food</option>
          <option value="abstract">Abstract</option>
        </select>
      </div>

      <div class="control-group">
        <label for="autoRefresh">⏱️ Auto-Refresh (seconds):</label>
        <select id="autoRefresh" class="select">
          <option value="0">Off</option>
          <option value="3">3s</option>
          <option value="5">5s</option>
          <option value="10">10s</option>
        </select>
      </div>
    </div>

    <div class="image-display">
      <div class="image-wrapper">
        <div class="loading-spinner" id="spinner" style="display: none;">
          <div class="spinner"></div>
        </div>
        <img id="image" src="" alt="Random Image" class="gallery-image">
      </div>
      
      <div class="image-info">
        <span id="imageInfo">Click generate to load an image</span>
      </div>
    </div>

    <div class="action-buttons">
      <button id="generate" class="btn btn-primary">✨ Generate Image</button>
      <button id="copyUrl" class="btn btn-secondary">📋 Copy URL</button>
      <button id="downloadBtn" class="btn btn-secondary">📥 Download</button>
      <button id="addFavorite" class="btn btn-secondary">❤️ Favorite</button>
    </div>

    <div class="stats-bar">
      <span class="stat">Generated: <strong id="generatedCount">0</strong></span>
      <span class="stat">Favorites: <strong id="favoriteCount">0</strong></span>
      <span class="stat" id="statusMsg">Ready</span>
    </div>

    <div class="favorites-section">
      <h2>⭐ Favorites</h2>
      <div id="favoritesGallery" class="favorites-grid">
        <p class="empty-message">No favorites yet. Click ❤️ to add!</p>
      </div>
      <button id="clearFavorites" class="btn btn-danger" style="display: none;">🗑️ Clear Favorites</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
