<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Board - Task Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      Home
    </a>
    <span class="nav-title">⚔️ quest.board</span>
  </nav>

  <main class="container">
    <header class="hero">
      <h1>Task Quest Arena</h1>
      <p>Capture quests, move them through stages, and clear the battlefield.</p>
    </header>

    <section class="control-panel">
      <input type="text" id="taskInput" placeholder="Add a new quest...">
      <select id="prioritySelect" title="Priority level" aria-label="Priority level">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button id="addTask" class="btn primary">Add Quest</button>
      <button id="clearDone" class="btn ghost">Clear Completed</button>
    </section>

    <section class="status-overview">
      <div class="pill">To Do: <span id="todoCount">0</span></div>
      <div class="pill">Doing: <span id="doingCount">0</span></div>
      <div class="pill">Done: <span id="doneCount">0</span></div>
      <div class="pill">Progress: <span id="progressText">0%</span></div>
    </section>

    <section class="progress-wrap" aria-label="Quest progress">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <section class="board">
      <div class="lane" data-lane="todo">
        <h2>📝 To Do</h2>
        <div id="todoList" class="lane-list"></div>
      </div>

      <div class="lane" data-lane="doing">
        <h2>🚀 Doing</h2>
        <div id="doingList" class="lane-list"></div>
      </div>

      <div class="lane" data-lane="done">
        <h2>✅ Done</h2>
        <div id="doneList" class="lane-list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
